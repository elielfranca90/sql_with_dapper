services:
  db:
    image: postgres:17
    container_name: dbsecrets-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: amin
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./dbsecrets.api
      dockerfile: Dockerfile
    container_name: dbsecrets-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=db;Port=5432;Database=postgres;User Id=postgres;Password=amin;
